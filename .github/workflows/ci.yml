name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  smoke-test:
    name: Smoke test (links, structure, hreflang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run smoke tests
        run: |
          python3 tests/smoke_test.py
          python3 tests/seo_audit.py
          node tools/build-static.mjs staging "$RUNNER_TEMP/static-staging"
          node tools/build-static.mjs production "$RUNNER_TEMP/static-production"

  backend-tests:
    name: Forms backend tests (mocked storage/email)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run backend test suite
        run: |
          npm ci --prefix api --ignore-scripts --no-audit --no-fund
          node --test api/tests/*.test.mjs
      - name: Verify complete Azure deployment package
        run: |
          node api/tools/package-azure.mjs "$RUNNER_TEMP/outliners-api"
          cd "$RUNNER_TEMP/outliners-api"
          npm ci --ignore-scripts --no-audit --no-fund
          node -e "import('./azure/src/index.js')"

  ui-regression:
    name: UI regression (axe accessibility, nav wrap, overflow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: npm install --no-save playwright@1.49.1 axe-core@4.10.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve site
        run: python3 -m http.server 8900 &
      - name: Run UI checks
        run: node tests/ui_checks.mjs
      - name: Consent and conversion integration (synthetic, no provider sends)
        run: node tests/consent_checks.mjs
      - name: Lighthouse mobile lab audit
        run: |
          CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")
          npx --yes lighthouse@13.6.0 http://localhost:8900/ --chrome-path="$CHROME_PATH" --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path="$RUNNER_TEMP/lighthouse-en.json" --only-categories=performance,accessibility,best-practices,seo
          npx --yes lighthouse@13.6.0 http://localhost:8900/el/ --chrome-path="$CHROME_PATH" --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path="$RUNNER_TEMP/lighthouse-el.json" --only-categories=performance,accessibility,best-practices,seo
          node tests/lighthouse_summary.mjs "$RUNNER_TEMP/lighthouse-en.json" "$RUNNER_TEMP/lighthouse-el.json"
      - uses: actions/upload-artifact@v4
        with:
          name: lighthouse-lab-results
          path: ${{ runner.temp }}/lighthouse-*.json
          retention-days: 7
