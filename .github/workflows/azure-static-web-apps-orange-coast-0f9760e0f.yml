name: OUTLINERS tenant static preview (Free)

# Only this new OUTLINERS resource is deployed; merges alone do not publish.
on:
  push:
    branches: [codex/azure-private-backend]
    paths: [.github/workflows/azure-static-web-apps-orange-coast-0f9760e0f.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: outliners-owned-free-static-preview
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and publish closed-forms preview to OUTLINERS Free SWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate site and assemble public-only staging package
        run: |
          python3 tests/smoke_test.py
          python3 tests/seo_audit.py
          node tools/build-static.mjs staging "$GITHUB_WORKSPACE/staging"
          test ! -e staging/api
          test ! -e staging/docs
          python3 - <<'PYTHON'
          from pathlib import Path
          for rel in ['submit-cv/index.html','request-talent/index.html','el/submit-cv/index.html','el/request-talent/index.html']:
              assert 'data-preview="true"' in (Path('staging')/rel).read_text(), rel
          PYTHON
      - name: Deploy only to the new OUTLINERS Free Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_COAST_0F9760E0F }}
          action: upload
          app_location: staging
          api_location: ''
          output_location: ''
          skip_app_build: true
